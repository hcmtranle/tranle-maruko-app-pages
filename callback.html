<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok Auth Callback</title>
<style>
body{font-family:-apple-system,sans-serif;max-width:640px;margin:60px auto;padding:0 20px;line-height:1.6;color:#222}
code{background:#f4f4f4;padding:8px 12px;border-radius:6px;display:block;word-break:break-all;margin:16px 0}
</style>
</head>
<body>
<h1>Xác thực TikTok thành công</h1>
<p>Copy đoạn mã bên dưới gửi lại cho Claude để hoàn tất kết nối:</p>
<code id="code">Đang đọc...</code>
<script>
const params = new URLSearchParams(window.location.search);
const code = params.get('code') || '(không tìm thấy mã — kiểm tra lại URL)';
document.getElementById('code').textContent = code;
</script>
</body>
</html>
